name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: make check (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install server (creates server/.venv)
        run: make server-install
      - name: Install web dependencies
        run: make web-install
      - name: make check (lint, tests, typecheck, build)
        run: make check

  python-tests-other-os:
    name: python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server (with dev extras)
        run: python -m pip install -e "server[dev]"
      - name: Run Python tests
        # sounddevice is mocked in the suite, so its import is not required here.
        run: python -m pytest server/tests
