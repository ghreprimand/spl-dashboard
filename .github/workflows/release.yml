name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build wheel and sdist (UI bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and bundle the web UI
        run: make ui-bundle
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build server --outdir dist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Extract this version's CHANGELOG entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "([^0-9.]|$)" {found=1; next}
            /^## / {if (found) exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry for $version; see CHANGELOG.md." > notes.md
          fi
          {
            echo "Install or upgrade: \`uvx spl-dashboard@$version\` — see the [README](https://github.com/${GITHUB_REPOSITORY}#install-and-run). Published on [PyPI](https://pypi.org/project/spl-dashboard/$version/)."
            echo
            cat notes.md
          } > body.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SPL Dashboard ${GITHUB_REF_NAME#v}" \
            --notes-file body.md \
            --verify-tag \
            dist/*
